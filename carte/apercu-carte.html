<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24312B">
<title>La Trattoria — L'ardoise</title>
<link rel="icon" type="image/png" href="icones/icone-192.png">
<link rel="stylesheet" href="ardoise.css">
<style>
  /* barre d'outils (masquée à l'impression) */
  .barreOutil{max-width:1080px;margin:0 auto 12px;display:flex;gap:10px;
    justify-content:flex-end;align-items:center;flex-wrap:wrap}
  .barreOutil .note{color:#E8E4D8;font-family:Georgia,serif;font-size:14px;
    margin-right:auto;opacity:.85}
  .btnCraie{font-family:Georgia,serif;font-size:14px;color:#24312B;background:#F3F1E7;
    border:0;border-radius:8px;padding:9px 16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .btnCraie:active{transform:translateY(1px)}
  .hs{max-width:640px;margin:40px auto;text-align:center;color:var(--craie);
    font-family:Georgia,serif;padding:0 18px;line-height:1.7}
  .hs code{background:rgba(243,241,231,.14);padding:2px 8px;border-radius:6px}
</style>
</head>
<body class="fondArdoise">

<div class="barreOutil sansImpression">
  <span class="note">L'ardoise — mise à jour en direct depuis la tablette</span>
  <button type="button" class="btnCraie" id="btn-rafraichir">Rafraîchir</button>
  <button type="button" class="btnCraie" id="btn-imprimer">🖨 Imprimer / PDF</button>
</div>

<main id="ardoise-page"><noscript>Activez JavaScript pour afficher l'ardoise.</noscript></main>

<script src="donnees.js"></script>
<script src="donnees-carte.js"></script>
<script src="ardoise-assets.js"></script>
<script src="qr-encodeur.js"></script>
<script>
/* ============================================================
   Page publique « L'ardoise » — lecture seule.
   Sources de données, dans l'ordre :
     1. l'API du serveur de carte (api/carte) si disponible ;
     2. sinon le localStorage local (mode autonome, ou module
        embarqué dans l'APK — même origine que l'éditeur).
   ============================================================ */
(function () {
  'use strict';

  var CLE_STOCK = 'trattoria.carte.v1';
  var CLE_CONFIG = 'trattoria.config.v1';
  var CRAIE = ['craie--jaune', 'craie--blanc', 'craie--rose', 'craie--verte', 'craie--bleue'];

  function echap(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function eur(v) {
    var n = Number(v);
    if (!isFinite(n)) n = 0;
    return n.toFixed(2).replace('.', ',') + ' €';
  }
  function prixAffiche(p) {
    var min = Number(p.pv) || 0;
    (p.formats || []).forEach(function (f) { if (f.pv > 0 && f.pv < min) min = f.pv; });
    return min;
  }

  /* ---- configuration par défaut + repli ---- */
  function configDefaut(catalogue) {
    var d = window.TRATTORIA_CONFIG_DEFAUT || {};
    var vu = {}, fams = [];
    catalogue.forEach(function (p) {
      var f = String(p.fam || 'Divers');
      if (!vu[f]) { vu[f] = true; fams.push(f); }
    });
    var out = {
      site: d.site || 'https://latrattoria-saintes.fr/',
      badges: (d.badges || []).slice(0, 4),
      pates: {
        titre: (d.pates && d.pates.titre) || 'Pâte à pizza maison',
        sous: (d.pates && d.pates.sous) || 'Fraîche, maturée 48 heures'
      },
      fams: {}
    };
    fams.forEach(function (f) {
      var def = (d.fams && d.fams[f]) || {};
      out.fams[f] = {
        titre: def.titre || f,
        sous: def.sous || '',
        ordre: catalogue.filter(function (p) { return String(p.fam) === f; })
          .map(function (p) { return p.id; }),
        libres: []
      };
    });
    return out;
  }

  function configNormalisee(c, catalogue) {
    var def = configDefaut(catalogue);
    if (!c || typeof c !== 'object') return def;
    var out = {
      site: String(c.site || '').trim() || def.site,
      badges: (Object.prototype.toString.call(c.badges) === '[object Array]')
        ? c.badges.filter(function (b) { return typeof b === 'string' && b.trim(); })
          .map(function (b) { return b.trim().slice(0, 40); }).slice(0, 4)
        : def.badges,
      pates: {
        titre: String((c.pates && c.pates.titre) || '').trim().slice(0, 60) || def.pates.titre,
        sous: String((c.pates && c.pates.sous) || '').trim().slice(0, 120) || def.pates.sous
      },
      fams: {}
    };
    def.fams && Object.keys(def.fams).forEach(function (f) {
      var src = (c.fams && c.fams[f]) || def.fams[f] || {};
      var presents = def.fams[f].ordre;
      var ordre = (Object.prototype.toString.call(src.ordre) === '[object Array]')
        ? src.ordre.filter(function (id) { return presents.indexOf(id) >= 0; }) : [];
      presents.forEach(function (id) { if (ordre.indexOf(id) < 0) ordre.push(id); });
      var libres = (Object.prototype.toString.call(src.libres) === '[object Array]')
        ? src.libres.slice(0, 30).filter(function (l) {
            return l && typeof l === 'object' && String(l.nom || '').trim();
          }) : [];
      out.fams[f] = {
        titre: String(src.titre || '').trim().slice(0, 60) || def.fams[f].titre,
        sous: String(src.sous || '').trim().slice(0, 120),
        ordre: ordre,
        libres: libres
      };
    });
    return out;
  }

  /* ---- rendu ---- */
  function rendu(catalogue, cfg) {
    var logo = (window.ARDOISE_ASSETS && window.ARDOISE_ASSETS.logo) || '';
    var h = '<div class="cadreBois">';
    h += '<header class="enteteArdoise">' +
      '<img class="logoCercle" alt="Logo La Trattoria" src="' + logo + '">' +
      '<h1 class="craie--blanc">La Trattoria</h1>' +
      '<div class="lieu craie--jaune">Saintes</div>' +
      '<div class="filetCraie"></div>';
    if (cfg.badges.length) {
      h += '<div class="badgesCraie">' + cfg.badges.map(function (b) {
        return '<span class="craie--verte">' + echap(b) + '</span>';
      }).join('') + '</div>';
    }
    h += '<div class="pateCraie"><span class="t craie--jaune">🍕 ' +
      echap(cfg.pates.titre) + '</span><span class="s craie--blanc">' +
      echap(cfg.pates.sous) + '</span></div></header>';

    var parId = {};
    catalogue.forEach(function (p) { parId[p.id] = p; });
    var ci = 0;

    Object.keys(cfg.fams).forEach(function (fam) {
      var conf = cfg.fams[fam];
      var items = (conf.ordre || []).map(function (id) {
        if (parId[id]) return parId[id].actif === false ? null : { kind: 'p', p: parId[id] };
        var l = conf.libres.filter(function (x) { return x.id === id; })[0];
        return l ? { kind: 'l', l: l } : null;
      }).filter(Boolean);
      if (!items.length) return;
      var craie = CRAIE[ci % CRAIE.length];
      ci++;
      var photo = null;
      items.some(function (it) {
        if (it.kind === 'p') { photo = it.p.photoArdoise || it.p.photo || null; return !!photo; }
        return false;
      });
      h += '<section class="catArdoise' + (photo ? ' catAvecPhoto' : '') + '">' +
        '<h2 class="' + craie + '">' + echap(conf.titre) + '</h2>' +
        (conf.sous ? '<div class="sousCat">' + echap(conf.sous) + '</div>' : '');
      if (photo) {
        h += '<figure class="photoCraie"><img src="' + photo + '" alt="Photo — ' +
          echap(conf.titre) + '" loading="lazy"></figure>';
      }
      h += '<ul class="itemsArdoise' + (items.length > 9 ? ' tailleModeree' : '') + '">';
      items.forEach(function (it) {
        if (it.kind === 'l') {
          h += '<li><div class="itemArdoise"><span class="nom craie--blanc">' +
            echap(it.l.nom) + '</span><span class="pts"></span>' +
            '<span class="prix craie--jaune">' + (it.l.prix > 0 ? eur(it.l.prix) : '') + '</span></div>' +
            (it.l.sous ? '<span class="desc">' + echap(it.l.sous) + '</span>' : '') +
            (it.l.desc ? '<span class="desc">' + echap(it.l.desc) + '</span>' : '') + '</li>';
        } else {
          var q = it.p;
          var sous = q.sous || q.desc || '';
          var formats = (q.formats && q.formats.length)
            ? q.formats.map(function (f) {
                return echap(f.nom) + ' <b class="craie--jaune">' + eur(f.pv) + '</b>';
              }).join(' · ') : null;
          h += '<li><div class="itemArdoise"><span class="nom craie--blanc">' +
            echap(q.nom) + '</span><span class="pts"></span>' +
            '<span class="prix craie--jaune">' + eur(prixAffiche(q)) + '</span></div>' +
            (sous ? '<span class="desc">' + echap(sous) + '</span>' : '') +
            (formats ? '<span class="desc">' + formats + '</span>' : '') + '</li>';
        }
      });
      h += '</ul></section>';
    });

    h += '<div class="qrBlocArdoise">' +
      '<div class="t craie--blanc">Retrouvez-nous en ligne</div>' +
      '<span class="s">Scannez pour ouvrir le site, la carte et commander</span>' +
      '<div class="qrCraie"><canvas id="qr-ardoise" aria-label="QR code du site"></canvas></div>' +
      '<span class="url craie--jaune">' + echap(cfg.site) + '</span></div>';
    h += '<div class="piedArdoise">La Trattoria — Saintes' +
      '<span class="coords">Tout est fait maison, dans la plus belle tradition italienne.</span></div>';
    h += '</div>';
    document.getElementById('ardoise-page').innerHTML = h;
    dessinerQR(cfg.site);
  }

  function dessinerQR(url) {
    var canvas = document.getElementById('qr-ardoise');
    if (!canvas || !window.TrattoriaQR) return;
    var u = String(url || '').trim();
    if (u && u.indexOf('://') < 0) u = 'https://' + u;
    var m = window.TrattoriaQR.makeMatrix(u, 'H');
    if (!m) return;
    window.TrattoriaQR.render(canvas, m, 512);
  }

  /* ---- sources de données ---- */
  function depuisLocalStorage() {
    var catalogue = [];
    try { catalogue = JSON.parse(localStorage.getItem(CLE_STOCK) || '[]') || []; } catch (e) { }
    if (!catalogue.length && window.TRATTORIA_CATALOGUE) catalogue = window.TRATTORIA_CATALOGUE;
    var cfg = null;
    try { cfg = JSON.parse(localStorage.getItem(CLE_CONFIG) || 'null'); } catch (e) { }
    rendu(catalogue, configNormalisee(cfg, catalogue));
  }

  function charger() {
    if (/^https?:$/.test(location.protocol) && typeof fetch === 'function') {
      fetch('api/carte', { cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error('ko');
        return r.json();
      }).then(function (d) {
        var catalogue = (d.carte && d.carte.length) ? d.carte
          : (window.TRATTORIA_CATALOGUE || []);
        rendu(catalogue, configNormalisee(d.config, catalogue));
      }).catch(depuisLocalStorage);
    } else {
      depuisLocalStorage();
    }
  }

  document.getElementById('btn-imprimer').addEventListener('click', function () {
    window.print();
  });
  document.getElementById('btn-rafraichir').addEventListener('click', charger);

  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', charger);
  else charger();
})();
</script>
</body>
</html>
